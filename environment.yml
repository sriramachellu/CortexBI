name: cortexbi
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.12
  - pip
  - pip:
      # Web framework
      - fastapi>=0.115.0
      - uvicorn[standard]>=0.30.0
      - python-multipart>=0.0.9

      # Data validation
      - pydantic>=2.7.0
      - pydantic-settings>=2.3.0

      # Database
      - sqlalchemy[asyncio]>=2.0.30
      - alembic>=1.13.1
      - asyncpg>=0.29.0
      - pgvector>=0.2.5

      # AI / LLM
      - langchain>=0.3.0
      - langchain-core>=0.3.0
      - langchain-google-genai>=2.0.0
      - langgraph>=0.2.0

      # ML
      - xgboost>=2.0.3
      - scikit-learn>=1.5.0
      - shap>=0.45.0
      - scipy>=1.12.0
      - pandas>=2.2.2
      - numpy>=1.26.4

      # Object storage
      - boto3>=1.34.0

      # Auth
      - pyjwt[crypto]>=2.8.0
      - bcrypt>=4.1.3

      # Utilities
      - httpx>=0.27.0
      - python-dotenv>=1.0.1
      - python-magic-bin>=0.4.14

      # Dev tools
      - pytest>=8.2.0
      - pytest-asyncio>=0.23.7
      - ruff>=0.5.0
