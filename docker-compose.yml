services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: cortexbi-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: cortexbi
      POSTGRES_PASSWORD: cortexbi_dev
      POSTGRES_DB: cortexbi
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cortexbi"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
